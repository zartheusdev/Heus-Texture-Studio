<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemiz Geçici Olarak Bakımdadır</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 16s linear infinite',
                        'spin-reverse': 'spin-reverse 20s linear infinite',
                        'float': 'float 5s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 4s ease-in-out infinite',
                    },
                    keyframes: {
                        'spin-reverse': {
                            '0%': { transform: 'rotate(0deg)' },
                            '100%': { transform: 'rotate(-360deg)' },
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' },
                        },
                        'pulseGlow': {
                            '0%, 100%': { opacity: '0.3', transform: 'scale(1)' },
                            '50%': { opacity: '0.6', transform: 'scale(1.08)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Ambient Radial Gradient Background */
        .bg-radial-gradient {
            background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.12) 0%, rgba(15, 23, 42, 0) 70%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-6 overflow-hidden relative selection:bg-indigo-500 selection:text-white">

    <!-- Subtle Background Ambient Glows -->
    <div class="fixed inset-0 bg-radial-gradient pointer-events-none"></div>
    <div class="fixed top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 sm:w-96 sm:h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>

    <!-- Main Card -->
    <main class="relative z-10 w-full max-w-xl mx-auto flex flex-col items-center text-center p-8 sm:p-12 rounded-3xl bg-slate-900/40 border border-slate-800/60 backdrop-blur-xl shadow-2xl shadow-indigo-950/20">
        
        <!-- Minimal Animated Gear Icon -->
        <div class="relative mb-8 animate-float">
            <div class="absolute inset-0 bg-indigo-500/20 rounded-full blur-xl"></div>
            
            <div class="relative w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center">
                <!-- Outer Gear -->
                <i class="fa-solid fa-gear text-5xl sm:text-6xl text-indigo-500/70 absolute animate-spin-slow"></i>
                <!-- Inner Reverse Gear -->
                <i class="fa-solid fa-gear text-3xl sm:text-4xl text-purple-400/80 absolute animate-spin-reverse translate-x-2.5 translate-y-2.5"></i>
                <!-- Center Icon Badge -->
                <div class="w-10 h-10 rounded-full bg-slate-950 border border-slate-800 flex items-center justify-center shadow-lg z-10">
                    <i class="fa-solid fa-wrench text-indigo-400 text-sm"></i>
                </div>
            </div>
        </div>

        <!-- Main Title -->
        <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white mb-4 leading-snug">
            Sitemiz Geçici Olarak <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">Bakımdadır</span>
        </h1>
        
        <!-- Subtitle -->
        <p class="text-slate-400 text-sm sm:text-base font-normal leading-relaxed max-w-md">
            Sizlere daha iyi hizmet verebilmek için çalışıyoruz. Lütfen daha sonra tekrar ziyaret ediniz.
        </p>

    </main>

</body>
</html>
